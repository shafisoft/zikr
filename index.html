<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // GitHub Pages SPA fallback: after the 404.html redirect, restore the
      // original path so BrowserRouter renders the right route.
      (function () {
        var r = sessionStorage.getItem('gh-pages-redirect');
        if (r && r !== location.pathname + location.search) {
          sessionStorage.removeItem('gh-pages-redirect');
          history.replaceState(null, '', r);
        }
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/zikr.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#012d1d" />
    <meta name="description" content="Islamic dhikr practice tracker - customizable zikr lists, manual progress entry, and personalized goals" />
    <title>Zikr - Islamic Dhikr Practice</title>
    <!-- Google Fonts for the Noor design system -->
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&family=Source+Sans+3:wght@400;600&family=Amiri:wght@400;700&family=Noto+Sans+Bengali:wght@400;600;700&display=swap" rel="stylesheet"/>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
